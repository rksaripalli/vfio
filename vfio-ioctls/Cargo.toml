[package]
name = "vfio-ioctls"
version = "0.5.2"
authors = [
  "The Cloud Hypervisor Authors",
  "Liu Jiang <gerry@linux.alibaba.com>",
]
license = "Apache-2.0 OR BSD-3-Clause"
description = "Safe wrappers over VFIO ioctls"
repository = "https://github.com/rust-vmm/vfio"
readme = "README.md"
edition = "2018"
keywords = ["vfio"]

[package.metadata.docs.rs]
features = ["kvm"]

[features]
default = ["kvm"]
kvm = ["kvm-ioctls", "kvm-bindings"]
mshv = ["mshv-ioctls", "mshv-bindings"]
vfio_cdev = ["iommufd-bindings", "iommufd-ioctls", "kvm"]

[dependencies]
byteorder = "1.2.1"
libc = "0.2.39"
log = "0.4"
kvm-bindings = { version = "0.12.0", optional = true }
kvm-ioctls = { version = "0.22.0", optional = true }
thiserror = { workspace = true }
vfio-bindings = { version = "=0.6.1", path = "../vfio-bindings" }
vm-memory = { version = ">= 0.16.0, < 0.18", features = ["backend-mmap"] }
vmm-sys-util = { workspace = true }
mshv-bindings = { version = "0.6.5", features = [
  "with-serde",
  "fam-wrappers",
], optional = true }
mshv-ioctls = { version = "0.6.5", optional = true }
  # TO (git dependency - works when fetched as git dep):
iommufd-bindings = { git = "https://github.com/rksaripalli/iommufd", branch = "s1_translation", optional = true }
iommufd-ioctls = { git = "https://github.com/rksaripalli/iommufd", branch = "s1_translation", optional = true }
# For local development:
#iommufd-bindings = { path = "../../iommufd/iommufd-bindings", optional = true }
#iommufd-ioctls = { path = "../../iommufd/iommufd-ioctls", optional = true }
# With CMDQV support (your fork):
# iommufd-bindings = { git = "https://github.com/rksaripalli/iommufd", branch = "cmdqv-support", optional = true }
# iommufd-ioctls = { git = "https://github.com/rksaripalli/iommufd", branch = "cmdqv-support", optional = true }
# Original upstream:
# iommufd-bindings = { git = "https://github.com/likebreath/iommufd", branch = "0129/rfc_viommu_vdevice", optional = true }
# iommufd-ioctls = { git = "https://github.com/likebreath/iommufd", branch = "0129/rfc_viommu_vdevice", optional = true }
